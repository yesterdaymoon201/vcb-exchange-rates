name: Thu thập tỷ giá Vietcombank

on:
  schedule:
    # Giờ Việt Nam (UTC+7): 09:05, 10:05, 23:05 hằng ngày.
    - cron: '5 2,3,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-vcb.yml'
      - 'scripts/sync_vcb.py'
      - 'tests/test_sync_vcb.py'

permissions:
  contents: write

concurrency:
  group: vcb-source-collector-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tải repository nguồn
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kiểm tra chương trình thu thập
        run: python -m unittest discover -s tests -v
      - name: Lấy tỷ giá ngày hiện tại và xử lý bù ngày lịch sử (nếu có)
        run: python scripts/sync_vcb.py --root .
      - name: Chỉ commit khi dữ liệu hoặc con trỏ thực sự thay đổi
        id: publish
        shell: bash
        run: |
          git add -A -- raw metadata/cursor.json metadata/no-data
          if git diff --cached --quiet; then
            echo 'Không có dữ liệu thay đổi; không tạo commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: collect verified Vietcombank exchange rates'
          git pull --rebase origin main
          git push origin HEAD:main
          if git diff --name-only HEAD^ HEAD -- raw | grep -q .; then
            echo "rates_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Yêu cầu dashboard cập nhật ngay khi kho nguồn có tỷ giá mới
        if: ${{ steps.publish.outputs.rates_changed == 'true' }}
        shell: bash
        env:
          DASHBOARD_DISPATCH_TOKEN: ${{ secrets.DASHBOARD_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$DASHBOARD_DISPATCH_TOKEN" ]]; then
            echo "Chưa thiết lập DASHBOARD_DISPATCH_TOKEN; dashboard vẫn tự đồng bộ theo các lượt 09:09/10:09/23:09 và lịch dự phòng."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer $DASHBOARD_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yesterdaymoon201/vcb-fx-dashboard/dispatches \
            -d '{"event_type":"vcb_source_updated"}'
          echo "Đã gửi sự kiện cập nhật sang dashboard."
